name: install-smoke

# Proves the installer actually lands a runnable `dragon` on every supported OS.
# Runs the PR's own install scripts (not the copy on main) so installer changes
# are validated before merge. The published release assets are public, so no
# secrets are needed. Also asserts the -baseline/-musl fallback resolves a real
# asset instead of 404ing on older-CPU / musl hosts.

on:
  push:
    branches: [main]
    paths: [install, install.ps1, .github/workflows/install-smoke.yml]
  pull_request:
    paths: [install, install.ps1, .github/workflows/install-smoke.yml]
  schedule:
    - cron: "37 7 * * 1" # weekly: catch a release that broke an OS's asset
  workflow_dispatch:

jobs:
  posix:
    name: bash install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest    # linux-x64 (glibc)
          - os: ubuntu-24.04-arm # linux-arm64 (the 5th shipped platform)
          - os: macos-14         # darwin-arm64 (Apple Silicon)
          - os: macos-13         # darwin-x64 (Intel)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install via the local bash script
        run: bash ./install
      - name: Binary runs and reports a version
        run: |
          set -euo pipefail
          bin="$HOME/.dragoncode/bin/dragon"
          test -x "$bin" || { echo "installer did not produce $bin"; exit 1; }
          ver="$("$bin" --version 2>&1 | tr -d '\r')"
          echo "dragon --version => $ver"
          test -n "$ver" || { echo "empty version output"; exit 1; }

  windows-bash:
    name: bash install (Git Bash on Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install via the local bash script (MSYS/Git Bash)
        run: bash ./install
      - name: dragon.exe runs and reports a version
        run: |
          set -euo pipefail
          bin="$HOME/.dragoncode/bin/dragon.exe"
          test -f "$bin" || { echo "installer did not produce $bin"; ls -la "$HOME/.dragoncode/bin" || true; exit 1; }
          ver="$("$bin" --version 2>&1 | tr -d '\r')"
          echo "dragon --version => $ver"
          test -n "$ver" || { echo "empty version output"; exit 1; }

  windows-native:
    name: PowerShell install.ps1 (native Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install via install.ps1
        run: ./install.ps1
      - name: dragon.exe runs and reports a version
        run: |
          $bin = Join-Path $HOME '.dragoncode\bin\dragon.exe'
          if (-not (Test-Path $bin)) { throw "installer did not produce $bin" }
          $ver = (& $bin --version) -join "`n"
          Write-Host "dragon --version => $ver"
          if ([string]::IsNullOrWhiteSpace($ver)) { throw "empty version output" }

  fallback-resolution:
    name: -baseline/-musl asset fallback resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A missing optimized asset falls back to the plain target
        run: |
          set -euo pipefail
          base="https://github.com/VELLORAAI/dragoncode-public-dist/releases/latest/download"
          probe() { curl -sIL -o /dev/null -w "%{http_code}" "$1" 2>/dev/null || echo 000; }
          # The optimized variants are not published; the plain targets are.
          for missing in dragon-linux-x64-baseline.tar.gz dragon-linux-x64-musl.tar.gz; do
            code="$(probe "$base/$missing")"
            echo "$missing => $code (expected 404)"
            test "$code" = "404" || { echo "unexpected: $missing now exists — update the installer fallback"; exit 1; }
          done
          for plain in dragon-linux-x64.tar.gz dragon-darwin-x64.zip dragon-windows-x64.zip; do
            code="$(probe "$base/$plain")"
            echo "$plain => $code (expected 200)"
            test "$code" = "200" || { echo "fallback target $plain is missing from latest release"; exit 1; }
          done

  silent-failure-guards:
    name: the installer refuses to succeed without installing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # THE regression test. The jobs above all run on a clean runner, where
      # `dragon` is on no PATH at all — so the version check never reaches the
      # branch that was broken, and they passed happily throughout. Catching it
      # requires deliberately putting a DIFFERENT dragon earlier on PATH.
      - name: A conflicting dragon on PATH does not suppress the install
        run: |
          set -euo pipefail
          target=1.5.61
          mkdir -p "$HOME/decoy" "$HOME/.dragoncode/bin"
          # A decoy that claims to already BE the target version.
          printf '#!/bin/sh\necho %s\n' "$target" > "$HOME/decoy/dragon"
          chmod +x "$HOME/decoy/dragon"
          # ...while the directory the installer actually writes holds an older one.
          printf '#!/bin/sh\necho 0.0.1\n' > "$HOME/.dragoncode/bin/dragon"
          chmod +x "$HOME/.dragoncode/bin/dragon"

          PATH="$HOME/decoy:$PATH" bash ./install --version "$target"

          got="$("$HOME/.dragoncode/bin/dragon" --version 2>&1 | tr -d '\r')"
          echo "install dir reports => $got (expected $target)"
          test "$got" = "$target" || {
            echo "REGRESSION: the installer consulted PATH instead of its install dir and installed nothing"
            exit 1
          }

      - name: A space in \$HOME still gets PATH written
        run: |
          set -euo pipefail
          home="/tmp/John Smith"
          rm -rf "$home"; mkdir -p "$home"
          : > "$home/.bashrc"
          SHELL=/bin/bash HOME="$home" bash ./install --version 1.5.61
          grep -q dragoncode "$home/.bashrc" || {
            echo "REGRESSION: word-splitting on \$HOME left PATH unwritten"
            exit 1
          }

      - name: GITHUB_ACTIONS without GITHUB_PATH does not abort
        run: |
          set -euo pipefail
          home=/tmp/ci-nopath
          rm -rf "$home"; mkdir -p "$home"
          env -u GITHUB_PATH GITHUB_ACTIONS=true HOME="$home" bash ./install --version 1.5.61
          test -x "$home/.dragoncode/bin/dragon" || { echo "install did not complete"; exit 1; }

      - name: An unknown option is refused, never a silent fall back to latest
        run: |
          set -euo pipefail
          if bash ./install --verison 1.5.61 >/dev/null 2>&1; then
            echo "REGRESSION: a typo'd flag was accepted and would install 'latest'"
            exit 1
          fi

      - name: A non-bash shell gets an actionable message, not a syntax error
        run: |
          set -euo pipefail
          sudo apt-get install -y dash >/dev/null 2>&1 || true
          out="$(dash ./install 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "requires bash" || {
            echo "REGRESSION: non-bash shells no longer get the guard message"
            exit 1
          }

      - name: --require-checksum refuses when it cannot verify
        run: |
          set -euo pipefail
          home=/tmp/nochecksum
          rm -rf "$home"; mkdir -p "$home/stub"
          # Hide every tool the checksum path needs, so verification cannot run.
          for t in sha256sum shasum jq python3; do
            printf '#!/bin/sh\nexit 127\n' > "$home/stub/$t"; chmod +x "$home/stub/$t"
          done
          if PATH="$home/stub:$PATH" HOME="$home" bash ./install --version 1.5.61 --require-checksum >/dev/null 2>&1; then
            echo "REGRESSION: --require-checksum installed an unverifiable download"
            exit 1
          fi
